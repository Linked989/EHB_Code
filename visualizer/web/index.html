<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>C² Ledger — DAG</title>
  <style>
    body { font-family: sans-serif; margin:0; }
    #title { padding:12px 16px; border-bottom:1px solid #ddd; }
    svg { width:100vw; height:90vh; display:block; }
    .label { font-size:12px; }
  </style>
</head>
<body>
  <div id="title">C² Ledger — Causal DAG</div>
  <svg id="svg"></svg>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script>
    fetch('/graph.json').then(r=>r.json()).then(data=>{
      const svg = d3.select("#svg"), w=window.innerWidth, h=window.innerHeight*0.9;
      const sim = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.links).id(d=>d.id).distance(80))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(w/2, h/2));

      const link = svg.append("g").attr("stroke","#999").attr("stroke-opacity",0.6)
        .selectAll("line").data(data.links).join("line");

      const node = svg.append("g").selectAll("circle").data(data.nodes).join("circle")
        .attr("r",10).attr("fill","#69b3a2").call(d3.drag()
          .on("start", e => { if(!e.active) sim.alphaTarget(0.3).restart(); e.subject.fx=e.subject.x; e.subject.fy=e.subject.y; })
          .on("drag",  e => { e.subject.fx=e.x; e.subject.fy=e.y; })
          .on("end",   e => { if(!e.active) sim.alphaTarget(0); e.subject.fx=null; e.subject.fy=null; }));

      const labels = svg.append("g").selectAll("text").data(data.nodes).join("text")
        .attr("class","label").attr("dy",-14).text(d=>d.type);

      sim.on("tick", ()=>{
        link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
        node.attr("cx",d=>d.x).attr("cy",d=>d.y);
        labels.attr("x",d=>d.x).attr("y",d=>d.y);
      });
    });
  </script>
</body>
</html>
